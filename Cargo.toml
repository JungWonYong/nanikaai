[package]
name = "nanikaai"
version = "1.2.2"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/JungWonYong/nanikaai"
description = "何か藍 (NanikaAi) — 100% Safe Rust製のAIデスクトップマスコット基盤 / Cross-Platform Safe Rust AI Desktop Mascot Baseware"

[dependencies]
winit = "0.30"
wgpu = "24"
pollster = "0.4"
cosmic-text = "0.12"
mouse_position = "0.1"
rfd = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg"] }
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
regex = "1"
url = "2"
rand = "0.8"
chrono = "0.4"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.19"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
