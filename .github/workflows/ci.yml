name: Behavior Spec Verification & Report CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine verification tier
        id: tier
        shell: bash
        run: |
          CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || true)
          NEED_RUST="false"
          if [[ -z "$CHANGED" ]]; then
            NEED_RUST="true"
          else
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              if [[ "$f" == assets/* ]] || [[ "$f" != *.md && "$f" != ".gitignore" && "$f" != "LICENSE" ]]; then
                NEED_RUST="true"
                break
              fi
            done <<< "$CHANGED"
          fi
          echo "need_rust=$NEED_RUST" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (code changes)
        if: steps.tier.outputs.need_rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache (code changes)
        if: steps.tier.outputs.need_rust == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dev libraries (code changes)
        if: runner.os == 'Linux' && steps.tier.outputs.need_rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev

      - name: Run automated specification verification & generate report
        shell: bash
        run: |
          if [[ "${{ steps.tier.outputs.need_rust }}" == "true" ]]; then
            python scripts/verify_behavior.py --mode standard --report-md verify_report.md --report-json verify_report.json
          else
            python scripts/verify_behavior.py --mode fast --report-md verify_report.md --report-json verify_report.json
          fi

      - name: Upload verification report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ matrix.os }}
          path: |
            verify_report.md
            verify_report.json
          if-no-files-found: ignore
