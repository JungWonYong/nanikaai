name: Release Multi-OS Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g., v0.1.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            platform: macos
          - name: windows-x64
            os: windows-latest
            platform: windows
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev

      - name: Run unit tests
        run: cargo test

      - name: Package macOS release bundle
        if: matrix.platform == 'macos'
        run: |
          bash scripts/build_macos.sh
          mkdir -p release-out
          ditto -c -k --sequesterRsrc --keepParent dist/NanikaAi.app release-out/NanikaAi-macos-arm64.zip

      - name: Package Windows release archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmd /c scripts\build_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Compress-Archive -Path dist\NanikaAi-win64 -DestinationPath release-out\NanikaAi-windows-x64.zip -Force

      - name: Package Linux release archive
        if: matrix.platform == 'linux'
        run: |
          bash scripts/build_linux.sh
          mkdir -p release-out
          tar -C dist -czf release-out/NanikaAi-linux-x64.tar.gz nanikaai-linux

      - name: Upload built package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: release-out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release Assets
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "何か藍 — NanikaAi $TAG" --generate-notes
          gh release upload "$TAG" artifacts/* --clobber
